apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mesa-partes
  labels:
    app: api-gateway
    env: ${ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        env: ${ENV}
    spec:
      containers:
        - name: api-gateway
          image: ${IMAGE}
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mdpv-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # Margen de arranque de Spring Boot
          startupProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mesa-partes
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8082
      targetPort: 8082
