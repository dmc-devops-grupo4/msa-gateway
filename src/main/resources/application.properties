spring.cloud.gateway.routes[2].predicates[0]=Path=/mspersona/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/mspersona(?<remaining>.*), /api${remaining}

spring.cloud.gateway.routes[3].id=msarchivo
spring.cloud.gateway.routes[3].uri=${URI_SERVICE_ARCHIVO:http://localhost:8087}
spring.cloud.gateway.routes[3].predicates[0]=Path=/msarchivo/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/msarchivo(?<remaining>.*), /api${remaining}

spring.cloud.gateway.routes[4].id=msseguridad
