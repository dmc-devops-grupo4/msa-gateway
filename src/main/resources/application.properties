spring.application.name=api-gateway
server.port=${SERVER_PORT:8082}

# Rutas hacia los microservicios
spring.cloud.gateway.routes[0].id=mstramites
spring.cloud.gateway.routes[0].uri=${URI_SERVICE_TRAMITES:http://localhost:8085}
spring.cloud.gateway.routes[0].predicates[0]=Path=/mstramites/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/mstramites(?<remaining>.*), /api${remaining}

spring.cloud.gateway.routes[1].id=msnotificaciones
spring.cloud.gateway.routes[1].uri=${URI_SERVICE_NOTIFICACIONES:http://localhost:8086}
spring.cloud.gateway.routes[1].predicates[0]=Path=/msnotificaciones/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/msnotificaciones(?<remaining>.*), /api${remaining}

spring.cloud.gateway.routes[2].id=mspersona
